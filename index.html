<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Second Choice 100/0 — Lirik</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; overflow: hidden; background: #050505; color: #f7f7f7; text-transform: uppercase; }
    .stage { min-height: 100svh; display: grid; place-items: center; position: relative; isolation: isolate; padding: 2rem; }
    .stage::before { content: ""; position: absolute; width: min(70vw, 620px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.045), transparent 68%); filter: blur(14px); opacity: 0; transition: opacity 1.5s ease; z-index: -1; }
    .stage.started::before { opacity: 1; }
    .song-title { position: absolute; top: calc(62px + env(safe-area-inset-top)); left: 1rem; right: 1rem; margin: 0; text-align: center; font-size: clamp(.84rem, 2.4vw, 1.08rem); font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.72); text-shadow: 0 0 16px rgba(255,255,255,.3); opacity: 0; transform: translateY(-6px); animation: title-appear 1.3s ease .35s forwards; transition: opacity .55s ease, transform .55s ease; }
    .stage.leaving .song-title, .stage.started .song-title { animation: title-leave .8s cubic-bezier(.25,.7,.3,1) forwards !important; }
    @keyframes title-appear { to { opacity: 1; transform: translateY(0); } }
    @keyframes title-leave { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-30px); } }
    .start { display: grid; justify-items: center; gap: 1.1rem; border: 0; padding: 1rem; color: inherit; background: transparent; cursor: pointer; opacity: 0; transform: translateY(8px); animation: appear 1.4s ease .5s forwards; transition: opacity .55s ease, transform .55s ease; }
    .start:hover .play { box-shadow: 0 0 35px rgba(255,255,255,.24), inset 0 0 18px rgba(255,255,255,.09); transform: scale(1.06); }
    .start:focus-visible, .control:focus-visible { outline: 1px solid #fff; outline-offset: 6px; }
    .play { width: 76px; height: 76px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.56); border-radius: 50%; box-shadow: 0 0 24px rgba(255,255,255,.12), inset 0 0 14px rgba(255,255,255,.04); transition: .4s ease; }
    .play svg { margin-left: 4px; width: 21px; height: 24px; fill: currentColor; filter: drop-shadow(0 0 9px rgba(255,255,255,.8)); }
    .hint { font-size: .7rem; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.58); }
    @keyframes appear { to { opacity: 1; transform: translateY(0); } }
    .lyrics { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; pointer-events: none; }
    .line { max-width: min(900px, 90vw); text-align: center; font-family: "Arial Black", Arial, "Segoe UI", system-ui, sans-serif; font-size: clamp(1.5rem, 4.3vw, 3rem); line-height: 1.5; font-weight: 900; font-style: normal; letter-spacing: -.025em; text-wrap: balance; -webkit-text-stroke: 1.35px #050505; paint-order: stroke fill; text-shadow: 0 0 10px rgba(255,255,255,.2); opacity: 0; transform: translateY(8px) scale(.99); filter: blur(2px); transition: opacity .48s ease, transform .6s cubic-bezier(.2,.75,.25,1), filter .6s ease; }
    .line.visible { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    .start.hidden { animation: start-leave .65s ease forwards; pointer-events: none; }
    @keyframes start-leave { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(4px) scale(.94); } }
    .controls { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; display: flex; align-items: center; gap: 16px; transform: translate(-50%, 8px); opacity: 0; transition: opacity .6s ease, transform .6s ease; }
    .controls.visible { opacity: .7; transform: translate(-50%, 0); }
    .controls.visible:hover { opacity: 1; }
    .control { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; cursor: pointer; }
    .control svg { width: 14px; height: 14px; fill: currentColor; }
    .progress { width: min(24vw, 150px); height: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
    .progress span { display: block; width: 0; height: 100%; background: #fff; box-shadow: 0 0 8px #fff; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <h1 class="song-title">Second Choice 100/0</h1>
    <button class="start" id="start" type="button" aria-label="Mulai musik dan lirik">
      <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l11 7.2a1.1 1.1 0 0 1 0 1.8l-11 7.2c-.7.4-1.6-.1-1.6-.9z"/></svg></span>
      <span class="hint">Play</span>
    </button>
    <section class="lyrics" aria-live="polite" aria-atomic="true"><div class="line" id="line"></div></section>
    <div class="controls" id="controls" aria-label="Kontrol audio">
      <button class="control" id="toggle" type="button" aria-label="Jeda musik"><svg id="toggleIcon" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      <span class="sr-only" id="status">Musik belum diputar</span>
    </div>
    <!-- GANTI FILE INI: audio yang dipakai ada di lagu.mp3. -->
    <audio id="song" preload="auto" src="lagu.mp3"></audio>
  </main>
<script>
  const lyrics = [
    { at: 0, text: 'Yang ku mau menghabiskan waktu ku' },
    { at: 2.90, text: 'hanya bersamamu' },
    { at: 4.69, text: 'tapi kau lebih memilih habiskan waktumu' },
    { at: 8.32, text: 'tanpa diriku' },
    { at: 10.10, text: 'sibuk dengan duniamu kau melupakan diriku' },
    { at: 14.04, text: 'apa kau pernah memikirkanku' },
    { at: 17.46, text: 'seperti ku yang selalu pikirkanmu' },
    { at: 20.65, text: 'apa kah pernah kau mencariku' },
    { at: 23.91, text: 'seperti aku yang selalu mencarimu' },
    { at: 27.24, text: 'apa kau kan mencari saat diriku hilang' },
    { at: 30.37, text: 'apa saat ku pergi kau rasa kehilangan' },
    { at: 33.83, text: 'atau cuman diriku sendiri yang rasakan' },
    { at: 37.25, text: 'rasa takut jika nanti semuanya menghilang' }
  ];
  const audio = document.querySelector('#song');
  const start = document.querySelector('#start');
  const line = document.querySelector('#line');
  const stage = document.querySelector('#stage');
  const controls = document.querySelector('#controls');
  const toggle = document.querySelector('#toggle');
  const toggleIcon = document.querySelector('#toggleIcon');
  const progress = document.querySelector('#progress');
  const status = document.querySelector('#status');
  let activeIndex = -1;
  let lyricClock = 0;
  const visualIntroDelay = 0.45;
  const audioAfterVisualDelay = 0.5;
  const lyricRevealDelay = 0;
  const targetVolume = 0.82;
  const initialVolume = 0.32;

  function fadeAudioTo(target, duration = 1200) {
    const from = audio.volume;
    const started = performance.now();
    function step(now) {
      if (audio.paused) return;
      const progress = Math.min(1, (now - started) / duration);
      audio.volume = from + (target - from) * progress;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function reportAudioError(error) {
    const mediaCode = audio.error?.code;
    const detail = mediaCode === 4 || error?.name === 'NotSupportedError'
      ? 'Browser tidak mendukung codec audio ini. Pastikan file berupa MP3.'
      : mediaCode === 2
        ? 'File ditemukan, tetapi gagal dibaca. Coba salin ulang lagu.mp3.'
        : 'File musik tidak ditemukan. Pastikan lagu.mp3 ada di samping index.html.';
    status.textContent = detail;
    start.querySelector('.hint').textContent = detail;
    console.error('Audio gagal:', { detail, mediaCode, error });
  }

  audio.addEventListener('error', () => reportAudioError());

  document.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !start.classList.contains('hidden')) {
      event.preventDefault();
      start.click();
    }
  });

  function showLyric(index, transitionDelay = 120) {
    if (index === activeIndex) return;
    activeIndex = index;
    line.classList.remove('visible');
    window.setTimeout(() => {
      line.textContent = lyrics[index]?.text ?? '';
      requestAnimationFrame(() => line.classList.toggle('visible', index >= 0));
    }, transitionDelay);
  }

  function updateLyrics() {
    if (audio.paused) return;
    const elapsed = audio.currentTime - lyricClock;
    if (elapsed < lyricRevealDelay) {
      showLyric(-1);
      requestAnimationFrame(updateLyrics);
      return;
    }
    let next = -1;
    for (let i = 0; i < lyrics.length; i++) {
      if (elapsed >= lyrics[i].at) next = i;
      else break;
    }
    showLyric(next);
    const end = lyrics[lyrics.length - 1].at + 4;
    progress.style.width = `${Math.min(100, Math.max(0, elapsed / end * 100))}%`;
    if (elapsed >= end) showLyric(-1);
    requestAnimationFrame(updateLyrics);
  }

  start.addEventListener('click', async () => {

    start.classList.add('hidden');
    stage.classList.add('leaving');
    try {
      await new Promise(resolve => window.setTimeout(resolve, visualIntroDelay * 1000));
      stage.classList.add('started');
      controls.classList.add('visible');
      showLyric(0, 0);
      await new Promise(resolve => window.setTimeout(resolve, audioAfterVisualDelay * 1000));
      lyricClock = audio.currentTime;
      audio.volume = initialVolume;
      await audio.play();
      fadeAudioTo(targetVolume, 650);
      status.textContent = 'Musik sedang diputar';
      requestAnimationFrame(updateLyrics);
    } catch (error) {
      start.classList.remove('hidden');
      stage.classList.remove('leaving');
      stage.classList.remove('started');
      controls.classList.remove('visible');
      showLyric(-1, 0);
      reportAudioError(error);
    }
  });

  toggle.addEventListener('click', async () => {
    if (audio.paused) { 
      await audio.play();
      fadeAudioTo(targetVolume, 450);
      toggle.setAttribute('aria-label', 'Jeda musik');
      toggleIcon.innerHTML = '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
      status.textContent = 'Musik sedang diputar';
      requestAnimationFrame(updateLyrics);
    } else {
      audio.pause();
      toggle.setAttribute('aria-label', 'Lanjutkan musik');
      toggleIcon.innerHTML = '<path d="M7 4.8c0-.8.9-1.3 1.6-.9l11 7.2a1.1 1.1 0 0 1 0 1.8l-11 7.2c-.7.4-1.6-.1-1.6-.9z"/>';
      status.textContent = 'Musik dijeda';
    }
  });
</script>
</body>
</html>
